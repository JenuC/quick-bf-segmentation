[project]
name = "20261012-flucolandcells"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cellpose>=4.2.1.1",
    "matplotlib>=3.11.2",
    "micro-sam",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "stardist>=0.9.2",
    "tensorflow>=2.21.0",
    "tifffile>=2026.9.20",
]

[project.optional-dependencies]
# GPU machine: `uv sync --extra gpu` installs CUDA 12.6 builds of torch.
# Plain `uv sync` keeps the CPU-only builds from PyPI.
cpu = ["torch>=2.14.1", "torchvision>=0.29.1"]
gpu = ["torch>=2.14.1", "torchvision>=0.29.1"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", extra = "gpu" }]
torchvision = [{ index = "pytorch-cu126", extra = "gpu" }]
micro-sam = { git = "https://github.com/computational-cell-analytics/micro-sam", rev = "v1.8.14" }
